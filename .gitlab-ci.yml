pages:
  stage: deploy
  image: node:20-alpine
  script:
    - node scripts/build.js
    - mkdir public
    - cp index.html style.css content.js assets-index.js favicon.png favicon.svg public/
    - cp -r assets public/assets
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH